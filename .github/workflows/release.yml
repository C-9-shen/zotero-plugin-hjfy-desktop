name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check tag matches package version
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Release tag must match package.json version");'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: npm run lint:check
      - name: Run unit tests
        run: npm run test:unit
      - name: Check source and test types
        run: npm run typecheck
      - name: Build plugin
        run: npm run build
      - name: Publish release and update manifests
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
