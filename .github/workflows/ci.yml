name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: npm run lint:check
      - name: Run unit tests
        run: npm run test:unit
      - name: Check source and test types
        run: npm run typecheck
      - name: Build plugin
        run: npm run build
      - name: Upload plugin and update manifests
        uses: actions/upload-artifact@v4
        with:
          name: zotero-hjfy-build
          path: |
            build/*.xpi
            build/update*.json
          if-no-files-found: error
